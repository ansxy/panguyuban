<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Source for `npm run tauri icon app-icon.svg`. Bale: a Sundanese open pavilion, drawn on a 64-unit grid. -->
  <!-- Colours are the Console theme in hex: paper oklch(21%/17%), accent oklch(82% 0.15 80). -->
  <defs>
    <linearGradient id="bg" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#15191c"/>
      <stop offset="1" stop-color="#0d1013"/>
    </linearGradient>
  </defs>
  <!-- macOS icon grid: an 824px rounded square centred on the 1024 canvas. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="4"/>
  <g transform="translate(256 256) scale(8)" color="#f7b83d">
    <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 31 Q12 31 16 26.5 L32 11 L48 26.5 Q52 31 59 31"/>
      <path d="M18 33 V53 M46 33 V53 M11 54 H53"/>
    </g>
    <circle cx="32" cy="43" r="4.5" fill="currentColor"/>
  </g>
</svg>
