[package]
name = "panguyuban-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "panguyuban_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agent-runtime = { path = "../../../crates/agent-runtime" }
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "5"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
libc = "0.2"
panguyuban-core = { path = "../../../crates/panguyuban-core" }
portable-pty = "0.9"
provider-github = { path = "../../../crates/provider-github" }
provider-plane = { path = "../../../crates/provider-plane" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-event-kit = { version = "0.3", default-features = false, features = ["std", "block2", "EKCalendar", "EKCalendarItem", "EKEvent", "EKEventStore", "EKObject", "EKTypes"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDate", "NSEnumerator", "NSError", "NSPredicate", "NSString", "NSURL"] }
